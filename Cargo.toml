[package]
name = "qualia-bioauth"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "LGPL-3.0-or-later"
description = "Auth-bound key storage: wrapping a 32-byte key behind platform user authentication (Android BiometricPrompt, Windows Hello)."
repository = "https://github.com/Qualia2FA/QualiaBioAuth"
keywords = ["biometric", "windows-hello", "keystore", "authentication"]
categories = ["authentication", "hardware-support"]
readme = "README.en.md"
# CI configuration and the dependency audit manifest are not part of the
# published package: they are meaningless to users, and the size and contents of
# a crates.io package are publicly visible.
exclude = ["/.github", "/deny.toml"]

# This crate is an independent library: it does not depend on qualia2fa-core, does
# not know the vault format, and defines its own 32-byte key type. Its only job is
# "wrap this key so that using it requires the platform's user authentication".
#
# `unsafe` is allowed in the platform backends and nowhere else. Every unsafe block
# states its invariant under `// SAFETY:`; CI raises `undocumented_unsafe_blocks` to
# an error.
#
# The crate root does not write `#![forbid(unsafe_code)]`, because the Windows and
# Android backends are FFI calls.

[dependencies]
# Error types. Same major as the rest of the project, to avoid two copies.
thiserror = "2.0.21"

# Wipes the master key and the derived keys. The crate's own `MasterKey` implements
# `Drop` with it.
zeroize = "1.8"

# Constant-time comparison for the master key. The same major version the rest of the
# project pulls in through `p256`, so no second copy appears in the binary.
subtle = { version = "2.6", default-features = false }

# OS CSPRNG. Production backends never need it (the platform generates the key and
# the nonce), but the mock backend and `MasterKey::generate` do, and both are only
# reachable under the `mock` feature or in tests.
getrandom = { version = "0.4.3", optional = true }

# The authenticated encryption used by the mock backend and by the Windows backend
# (the `hmac-secret` output is a 32-byte key, and the wrapped master key is encrypted
# with XChaCha20-Poly1305).
chacha20poly1305 = "0.11.0"

# Windows Hello through the Win32 WebAuthn API. `windows-sys` links directly
# against `webauthn.dll`; no `LoadLibrary` is involved.
#
# Only the modules this crate calls are enabled: the Foundation types (`HWND`), the
# WebAuthn surface, `BCryptGenRandom` for fresh challenges, and
# `GetForegroundWindow` to parent the Hello prompt.
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_Networking_WindowsWebServices",
    "Win32_UI_WindowsAndMessaging",
] }

[features]
# Exposes the software mock backend and `MasterKey::generate`.
#
# **Off by default.** The mock has no user authentication at all; it exists so that
# tests of the format and the state machine do not need a TPM or a fingerprint.
mock = ["dep:getrandom"]

[dev-dependencies]
# `cfg(test)` builds the mock module even without `--features mock`, so the
# dependencies it needs must be present for tests too.
getrandom = "0.4.3"

# The acceptance diagnostic. It needs `MasterKey::generate` to produce a throwaway
# key, so it is only built with the mock feature explicitly.
[[bin]]
name = "hello_probe"
path = "src/bin/hello_probe.rs"
required-features = ["mock"]

[lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
missing_docs_in_private_items = "warn"
undocumented_unsafe_blocks = "deny"
